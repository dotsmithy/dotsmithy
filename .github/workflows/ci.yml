# CI de dotsmithy: gate de cada PR (y de los push a main y a next).
# Compila, pasa go vet + go test, linta el shim y corre la integración en Fedora.
name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build -o dist/dots ./cmd/dots
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: referencia de comandos al día
        run: |
          # La referencia de docs/reference/commands sale de la ayuda de los
          # comandos: si alguien cambia la ayuda y no la regenera, falla aquí.
          go generate ./tools/docgen
          if ! git diff --exit-code -- docs/reference/commands \
            || [ -n "$(git status --porcelain -- docs/reference/commands)" ]; then
            echo "::error::la referencia de comandos está desfasada: ejecuta «devbox run docs» (o «go generate ./tools/docgen») y súbela"
            exit 1
          fi

  shellcheck:
    name: shellcheck (shim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck + sintaxis
        run: |
          # Lint de todos los scripts .sh versionados (shim, integración, lab…).
          shellcheck $(git ls-files '*.sh')
          bash -n script/install.sh
      - name: shim (instalación simulada)
        run: ./tests/shim/run.sh

  integration:
    name: integración (Fedora)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Compilamos en el host (estático) el binario que probaremos dentro de Fedora.
      - name: build (linux/amd64 estático)
        run: CGO_ENABLED=0 go build -trimpath -o tests/integration/dots ./cmd/dots
      # Corremos los escenarios reales dentro de una Fedora limpia (dnf nativo).
      # Es el mismo flujo que tests/integration/run.sh en local, pero con docker
      # (lo que traen los runners) en vez de podman.
      - name: escenarios en Fedora (smoke + init/link/paquetes)
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:41 bash -c '
            set -euo pipefail
            install -m 0755 tests/integration/dots /usr/local/bin/dots
            ln -sf dots /usr/local/bin/ds
            bash tests/integration/smoke.sh
            bash tests/integration/packages.sh
          '
      # Perfiles compuestos, en un contenedor aparte para partir de un $HOME limpio.
      - name: escenario de perfiles compuestos en Fedora
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:41 bash -c '
            set -euo pipefail
            install -m 0755 tests/integration/dots /usr/local/bin/dots
            ln -sf dots /usr/local/bin/ds
            bash tests/integration/profiles.sh
          '

  # La plantilla de contenido (template/) es parte del producto y va a la par que el
  # motor: se valida con el dots compilado en este mismo PR, no con la última
  # release. Así un cambio de esquema y su plantilla se prueban juntos antes de
  # mergear. Es lo mismo que hace template/.github/workflows/validate.yml en el
  # repo espejo, pero contra el motor de la rama.
  template:
    name: plantilla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build -o dist/dots ./cmd/dots
      - name: shellcheck de los hooks
        working-directory: template
        run: |
          shopt -s globstar nullglob
          hooks=(./**/hooks/**/*.sh)
          if [ ${#hooks[@]} -gt 0 ]; then shellcheck "${hooks[@]}"; fi
      # Cargar el manifiesto ya lo valida; después enlazamos cada perfil en un
      # $HOME vacío para ver que no hay conflictos ni capas rotas.
      - name: link de cada perfil en un $HOME vacío
        working-directory: template
        run: |
          dots="$GITHUB_WORKSPACE/dist/dots"
          profiles=$(yq '.profiles | keys | .[]' dots.yaml)
          if [ -z "$profiles" ]; then
            echo "::error::el manifiesto de la plantilla no declara ningún perfil"
            exit 1
          fi
          for profile in $profiles; do
            echo "::group::perfil $profile"
            home=$(mktemp -d)
            HOME="$home" "$dots" link --content "$PWD" --profile "$profile"
            echo "::endgroup::"
          done
