# Configuración de goreleaser para el motor dotsmithy.
# Empaqueta el binario «dots» para linux (amd64 + arm64), estático, y arma la
# Release en GitHub con archivos tar.gz + checksums.
version: 2

project_name: dotsmithy

before:
  hooks:
    - go mod tidy

builds:
  - id: dots
    main: ./cmd/dots
    binary: dots
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X go.kreikol.dev/dotsmithy/internal/cli.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - script/install.sh

checksum:
  name_template: "checksums.txt"

# Notas de la versión: salen de los commits entre el tag anterior y el actual. Como
# los PRs a next entran con squash, cada commit es un PR con su Conventional Commit,
# así que basta con agruparlos por tipo.
#
# El tag anterior lo decide el workflow de release (GORELEASER_PREVIOUS_TAG): en una
# versión final se salta los -rc, para que v1.1.0 cuente todo desde v1.0.x y no solo
# desde el último rc. Se hace ahí porque git.ignore_tags y tag_sort: smartsemver son
# de goreleaser Pro.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      # Los merge commits de next → main (release) y main → next (tras un hotfix)
      # no aportan nada: lo que traen ya sale commit a commit.
      - "^Merge pull request"
      - "^Merge branch"
      # Sincronizaciones automáticas (p.ej. la de la plantilla), por si acaban aquí.
      - "^chore: sync "
  groups:
    - title: Funcionalidades
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Arreglos
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentación
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Otros
      order: 999

release:
  github:
    owner: dotsmithy
    name: dotsmithy
  # Las candidatas (tags con sufijo de pre-release, como v1.1.0-rc.1) salen como
  # pre-release: GitHub no las marca como la última y el instalador no las usa
  # salvo que se pida con DOTS_VERSION.
  prerelease: auto
